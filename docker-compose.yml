services:
  food-api:
    build: .
    image: food-classifier-api:latest
    container_name: food-classifier-api
    ports:
      - "8000:8000"
    environment:
      BACKEND: onnx
      ORT_THREADS: "2"
      MAX_UPLOAD_BYTES: "8388608"
    restart: unless-stopped
    # Resurs chegarasi: bitta so'rov butun mashinani band qilib
    # qo'ymasligi uchun. ONNX Runtime mavjud yadrolarni to'liq egallashga
    # moyil, ORT_THREADS bilan birga bu ikki tomonlama himoya.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
